[project]
name = "agora"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "services/*",
    "mcp-servers/*",
    "agents/*",
    "infrastructure",
    "ui",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
    "mypy>=1.10",
    "boto3-stubs[dynamodb]>=1.34",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"mcp-servers/*/tests/*.py" = ["E402"]
"infrastructure/lambda/*.py" = ["E501"]
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
